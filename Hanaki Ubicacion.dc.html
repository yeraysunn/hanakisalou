<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="icon" type="image/png" href="assets/hanaki-logo.png"><link rel="apple-touch-icon" href="assets/hanaki-logo.png"><script src="./i18n.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap"><style>body{margin:0;background:#0B0B0B;color:#F3EEE6;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#C9A45C;text-decoration:none}a:hover{color:#F3EEE6}::selection{background:#7A1C1C;color:#F3EEE6}input,textarea,button{font-family:inherit}input::placeholder,textarea::placeholder{color:#6F695F}:focus-visible{outline:2px solid #C9A45C;outline-offset:2px}button:disabled{cursor:not-allowed}</style></helmet>

<header style="position:sticky;top:0;z-index:50;background:rgba(11,11,11,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(201,164,92,.18)">
<div style="max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,56px);height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px">
<a href="Hanaki%20Salou.dc.html" style="display:flex;align-items:center;gap:12px;color:#F3EEE6"><img src="assets/hanaki-logo.png" alt="花木" style="height:34px;width:auto;display:block"><span style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;letter-spacing:.32em">HANAKI</span></a>
<sc-if value="{{ isDesk }}" hint-placeholder-val="{{ true }}">
<nav style="display:flex;align-items:center;gap:clamp(16px,2vw,30px)"><sc-for list="{{ links }}" as="l" hint-placeholder-count="5"><a href="{{ l.h }}" target="{{ l.tg }}" style="color:#F3EEE6;font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase" style-hover="color:#C9A45C">{{ l.t }}</a></sc-for></nav>
<div style="display:flex;align-items:center;gap:22px"><div style="display:flex;gap:10px;font-size:11px;letter-spacing:.12em"><sc-for list="{{ langs }}" as="g" hint-placeholder-count="4"><sc-if value="{{ g.on }}"><span style="color:#C9A45C;border-bottom:1px solid #C9A45C;padding-bottom:2px">{{ g.t }}</span></sc-if><sc-if value="{{ g.off }}"><button onClick="{{ g.pick }}" style="background:none;border:none;padding:0 0 3px;color:#BDB6AB;cursor:pointer;font-size:11px;letter-spacing:.12em" style-hover="color:#F3EEE6">{{ g.t }}</button></sc-if></sc-for></div><div style="display:flex;gap:10px"><a href="Hanaki%20Carta.dc.html" style="background:transparent;border:1px solid #F3EEE6;color:#F3EEE6;padding:12px 23px;font-size:11.5px;font-weight:600;letter-spacing:.22em" style-hover="border-color:#C9A45C;color:#C9A45C">CARTA</a><a href="Hanaki%20Reservar.dc.html" style="background:#7A1C1C;color:#F3EEE6;padding:13px 24px;font-size:11.5px;font-weight:600;letter-spacing:.22em" style-hover="background:#B3261E;color:#F3EEE6">RESERVAR</a></div></div>
</sc-if>
<sc-if value="{{ isMob }}" hint-placeholder-val="{{ false }}"><button onClick="{{ toggleMenu }}" aria-label="Menú" style="background:none;border:1px solid rgba(243,238,230,.3);width:46px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer"><span style="width:20px;height:1.5px;background:#F3EEE6"></span><span style="width:20px;height:1.5px;background:#F3EEE6"></span><span style="width:14px;height:1.5px;background:#F3EEE6;align-self:center"></span></button></sc-if>
</div>
</header>

<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<div style="position:fixed;inset:76px 0 0 0;z-index:49;background:#0B0B0B;padding:40px 28px;display:flex;flex-direction:column;gap:6px;overflow:auto">
<div style="position:absolute;right:24px;top:30px;writing-mode:vertical-rl;font-family:serif;font-size:56px;color:#7A1C1C;letter-spacing:.2em">花木</div>
<sc-for list="{{ linksM }}" as="l" hint-placeholder-count="6"><a href="{{ l.h }}" target="{{ l.tg }}" onClick="{{ closeMenu }}" style="font-family:'Cormorant Garamond',serif;font-size:34px;letter-spacing:.14em;color:#F3EEE6;padding:6px 0;text-transform:uppercase">{{ l.t }}</a></sc-for>
<div style="display:flex;gap:18px;margin-top:28px;font-size:13px;letter-spacing:.14em"><sc-for list="{{ langs }}" as="g" hint-placeholder-count="4"><button onClick="{{ g.pick }}" style="background:none;border:none;padding:0;cursor:pointer;font-size:13px;letter-spacing:.14em;color:{{ g.c }}">{{ g.t }}</button></sc-for></div>
</div>
</sc-if>
<section id="como-llegar" data-screen-label="Cómo llegar" style="background:#0B0B0B;overflow:hidden;position:relative;min-height:calc(100svh - 76px);display:flex;align-items:center">
<img src="assets/fachada.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%;pointer-events:none"><div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(11,11,11,.96) 0%,rgba(11,11,11,.86) 42%,rgba(11,11,11,.7) 100%),linear-gradient(0deg,rgba(11,11,11,.9) 0%,rgba(11,11,11,0) 40%)"></div>
<div style="position:relative;width:100%;max-width:1440px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:clamp(36px,4.4vw,72px);padding:clamp(56px,6vw,96px) clamp(20px,4.5vw,72px)">
<div style="flex:1 1 380px;display:flex;flex-direction:column;gap:16px;max-width:560px">
<div style="display:flex;align-items:center;gap:14px;font-size:11px;font-weight:600;letter-spacing:.3em;color:#C9A45C;text-transform:uppercase"><span style="width:32px;height:1px;background:#C9A45C"></span>Ubicación</div>
<h1 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;line-height:1.05;letter-spacing:.16em;text-transform:uppercase;font-size:clamp(34px,3.8vw,54px);color:#F3EEE6">Cómo llegar</h1>
<p style="margin:0 0 14px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(20px,1.8vw,26px);line-height:1.3;color:#C9A45C">En pleno centro de Salou, a un paso de todo.</p>
<div style="display:flex;flex-direction:column;border-bottom:1px solid rgba(243,238,230,.1)">
<div style="display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid rgba(243,238,230,.1)"><span style="font-size:11px;font-weight:600;letter-spacing:.28em;color:#C9A45C;padding-top:3px">DIRECCIÓN</span><span style="font-size:15px;line-height:1.6;color:#E4DDD2">Carrer Major, 6<br>43840 Salou, Tarragona</span></div>
<div style="display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid rgba(243,238,230,.1)"><span style="font-size:11px;font-weight:600;letter-spacing:.28em;color:#C9A45C;padding-top:3px">HORARIO</span><span style="font-size:15px;line-height:1.6;color:#E4DDD2">Todos los días<br>12:30 – 16:30 · 19:30 – 23:30</span></div>
<div style="display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid rgba(243,238,230,.1)"><span style="font-size:11px;font-weight:600;letter-spacing:.28em;color:#C9A45C;padding-top:3px">TELÉFONO</span><span style="font-size:15px;line-height:1.6;color:#E4DDD2"><a href="tel:+34613261135" style="font-family:'Cormorant Garamond',serif;font-size:22px;color:#F3EEE6" style-hover="color:#C9A45C">613 261 135</a></span></div>
</div>
<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:14px">
<a href="https://www.google.com/maps/dir/?api=1&amp;destination=Carrer+Major+6,+43840+Salou" target="_blank" style="background:#7A1C1C;color:#F3EEE6;padding:17px 30px;font-size:12px;font-weight:600;letter-spacing:.22em" style-hover="background:#B3261E;color:#F3EEE6">CÓMO LLEGAR →</a>
<a href="tel:+34613261135" style="border:1px solid rgba(201,164,92,.6);color:#C9A45C;padding:16px 30px;font-size:12px;font-weight:600;letter-spacing:.22em" style-hover="background:#C9A45C;color:#0B0B0B">LLAMAR</a>
</div>
</div>
<div style="flex:1.3 1 420px;position:relative;padding:12px">
<div style="position:relative;aspect-ratio:16/11;overflow:hidden;background:#141414;outline:1px solid rgba(201,164,92,.4);outline-offset:11px"><iframe title="Mapa Hanaki Salou" src="https://www.google.com/maps?q=Carrer+Major+6,+43840+Salou&amp;z=16&amp;output=embed" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;border:0;filter:grayscale(1) invert(.92) contrast(.88) brightness(.9)"></iframe></div>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { menu: false, lang: ((window.HanakiI18n && window.HanakiI18n.get()) || 'es').toUpperCase(), w: window.innerWidth };
  componentDidMount() { this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.onR); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() {
    const s = this.state, mob = s.w < 1180, H = 'Hanaki%20Salou.dc.html';
    const L = [['Inicio', H + '#inicio'], ['Precios', H + '#precios'], ['Galería', H + '#galeria'], ['Reservas', 'Hanaki%20Reservar.dc.html'], ['Ubicación', 'Hanaki%20Ubicacion.dc.html'], ['Contacto', H + '#contacto']];
    const LM = [L[0], ['Carta', 'Hanaki%20Carta.dc.html'], ...L.slice(1)];
    const f = ([t, h]) => ({ t, h, tg: '_self' });
    return {
      isMob: mob, isDesk: !mob, menuOpen: mob && s.menu,
      toggleMenu: () => this.setState(x => ({ menu: !x.menu })), closeMenu: () => this.setState({ menu: false }),
      links: L.map(f), linksM: LM.map(f),
      langs: ['ES','CA','EN','FR'].map(t => ({ t, on: t === s.lang, off: t !== s.lang, c: t === s.lang ? '#C9A45C' : '#BDB6AB', pick: () => { this.setState({ lang: t }); window.HanakiI18n && window.HanakiI18n.set(t); } }))
    };
  }
}
</script>
</body>
</html>
