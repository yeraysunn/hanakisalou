<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu pedido · Hanaki Salou</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Saira+Extra+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/fidelidad/estilo.css">
<style>
.pasosp{list-style:none;margin:8px 0 24px;padding:0;display:grid;gap:4px}
.pasosp li{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--linea);color:var(--muted);font-size:15px}
.pasosp li i{width:28px;height:28px;border-radius:50%;border:1px solid var(--linea);display:grid;place-items:center;font-style:normal;font:700 15px/1 var(--num)}
.pasosp li.ok{color:var(--txt-hi)}.pasosp li.ok i{background:var(--rojo);border-color:var(--rojo);color:var(--tinta)}
.eta{background:var(--bg2);border-radius:18px;padding:18px;margin:0 0 20px}
.eta small{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.eta b{display:block;font:700 46px/1 var(--num);color:var(--txt-hi);margin-top:6px}
.lin{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--linea);font-size:14.5px}
.lin span:first-child{color:var(--txt-hi)}
.tot{display:flex;justify-content:space-between;margin-top:12px;font:700 24px/1 var(--num);color:var(--txt-hi)}
</style>
</head>
<body>
<div class="wrap">
  <header class="cab"><a href="/"><img src="/assets/logo.png" alt="花木"><span>HANAKI</span></a></header>
  <div id="err" class="err" hidden></div>
  <section id="ped" hidden>
    <div class="etq" id="num"></div>
    <h1 id="tit"></h1>
    <p class="lead" id="sub"></p>
    <div class="eta" id="eta" hidden><small id="etaT"></small><b id="etaH"></b></div>
    <ol class="pasosp" id="pasos"></ol>
    <div id="lineas"></div>
    <div class="tot"><span>Total</span><span id="total"></span></div>
    <p class="nota" id="pago" style="margin-top:8px"></p>
    <p class="nota" style="margin-top:20px">¿Algún problema con tu pedido? Llámanos al <a href="tel:+34613261135">613 261 135</a>.</p>
    <a class="btn sec" href="/" style="margin-top:12px">VOLVER A LA WEB</a>
  </section>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
  var eur = function(c){ return (c / 100).toFixed(2).replace('.', ',') + ' €'; };
  var t = new URLSearchParams(location.search).get('t');
  var hhmm = function(d){ return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
  var timer;
  function pintar(p){
    var dom = p.tipo === 'domicilio';
    $('num').textContent = 'Pedido nº ' + p.id + (dom ? ' · a domicilio' : ' · para recoger');
    var T = {
      pendiente: ['Pedido <em>enviado</em>', 'El restaurante lo está revisando. Te avisaremos por email. Esta página también se actualiza sola.'],
      aceptado: ['¡Pedido <em>aceptado</em>!', dom ? 'Ya lo estamos preparando.' : 'Ya lo estamos preparando. Te esperamos en Carrer Major, 6.'],
      en_camino: dom ? ['¡En <em>camino</em>!', 'El repartidor ya ha salido hacia tu casa.'] : ['¡Listo para <em>recoger</em>!', 'Pásate por Carrer Major, 6 · Salou.'],
      entregado: ['¡Que <em>aproveche</em>!', 'Gracias por pedir en Hanaki Salou.'],
      rechazado: ['Pedido <em>rechazado</em>', 'Lo sentimos, ahora no podemos atender tu pedido. No se te ha cobrado nada. Llámanos al 613 261 135 si quieres.'],
      cancelado: ['Pedido <em>cancelado</em>', 'Si es un error, llámanos al 613 261 135.'],
    }[p.estado];
    $('tit').innerHTML = T[0]; $('sub').textContent = T[1];
    var eta = null;
    if (p.aceptado && p.minutos && (p.estado === 'aceptado' || p.estado === 'en_camino')) eta = hhmm(new Date(Date.parse(p.aceptado) + p.minutos * 60000));
    if (p.hora && p.hora > (eta || '')) eta = p.hora;
    $('eta').hidden = !eta; $('etaT').textContent = dom ? 'Llegada aproximada' : 'Listo aproximadamente a las'; $('etaH').textContent = eta || '';
    var orden = ['pendiente','aceptado','en_camino','entregado'], k = orden.indexOf(p.estado);
    var nombres = ['Enviado', 'Aceptado · en cocina', dom ? 'En camino' : 'Listo para recoger', dom ? 'Entregado' : 'Recogido'];
    $('pasos').innerHTML = k < 0 ? '' : nombres.map(function(n, i){ return '<li class="' + (i <= k ? 'ok' : '') + '"><i>' + (i + 1) + '</i>' + n + '</li>'; }).join('');
    $('lineas').innerHTML = p.items.map(function(x){ return '<div class="lin"><span>' + x.uds + ' × ' + esc(x.nombre) + '</span><span>' + eur(x.precio * x.uds) + '</span></div>'; }).join('')
      + (dom ? '<div class="lin"><span>Envío</span><span>' + (p.envio ? eur(p.envio) : 'Gratis') + '</span></div>' : '');
    $('total').textContent = eur(p.total);
    $('pago').textContent = 'Pago al ' + (dom ? 'recibir' : 'recoger') + ': ' + (p.pago === 'tarjeta' ? 'con tarjeta.' : 'en efectivo' + (p.cambio ? ' (pagas con ' + eur(p.cambio) + ').' : '.'))
      + (dom ? ' Dirección: ' + p.direccion + ', ' + p.cp + '.' : '');
    $('ped').hidden = false;
    clearTimeout(timer);
    if (['pendiente','aceptado','en_camino'].indexOf(p.estado) >= 0) timer = setTimeout(cargar, p.estado === 'pendiente' ? 8000 : 20000);
  }
  function cargar(){
    fetch('/api/pedidos/estado?t=' + encodeURIComponent(t || ''), { cache: 'no-store' }).then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.error); return j; }); })
      .then(function(j){ $('err').hidden = true; pintar(j.pedido); })
      .catch(function(e){ $('err').textContent = e.message || 'Sin conexión. Reintentando…'; $('err').hidden = false; timer = setTimeout(cargar, 15000); });
  }
  cargar();
})();
</script>
</body>
</html>
